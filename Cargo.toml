[workspace]
resolver = "3"
members = ["crates/graphersal-server"]

[workspace.package]
version = "0.1.0"
authors = ["Aleksandr Dederer <aleks@graphersal.dev>"]
repository = "https://github.com/graphersal/graphersal-server"
homepage = "https://graphersal.dev"
license = "Apache-2.0"
edition = "2024"
# The same MSRV as Graphersal (its path dependencies need 1.88).
rust-version = "1.88"

[workspace.dependencies]
# Graphersal's hosting pieces, from the MAIN checkout of the graphersal repository beside this
# one (path dependencies; this repository is private and never published while it uses them).
graphersal = { path = "../graphersal/crates/graphersal" }
graphersal-serve = { path = "../graphersal/crates/graphersal-serve" }
# The session a served database runs in: `graphersal_serve::launch` takes its `SessionPresets`,
# and `Context::call` jobs receive its `Session` (already in the tree through graphersal-serve).
graphersal-session = { path = "../graphersal/crates/graphersal-session" }
# The MCP endpoint: `/mcp` over every database of the registry (its directory mode,
# `Mcp::handle_directory`) and `/db/<name>/mcp` per loaded database, one shared `Mcp` (sessions,
# token, statistics); already in the tree through graphersal-serve's `mcp` feature.
graphersal-mcp = { path = "../graphersal/crates/graphersal-mcp" }

# `server.toml` and the run file: the TOML reader/writer (serde based).
toml = "1"
serde = { version = "1.0", features = ["derive"] }
# The JSON answers of the HTTP API (`graphersal_serve::Response::json` takes a `serde_json::Value`;
# already in the tree through graphersal-serve).
serde_json = "1.0"
# `server.lock`: one running server per directory through the OS's advisory lock (`flock` /
# `LockFileEx`), released by the OS when the process ends, also on a crash; the same crate and
# version as the Store's lock in graphersal.
fd-lock = "4"
# The HTTP/1.1 listener (coordinator decision C7: hyper 1.x on tokio, no framework; the server
# keeps its own router): hyper's server connections answer an over-limit upload at once and
# close it cleanly, never read or allocate a body nobody asked for (`Expect: 100-continue` only
# when the body is read), and give the IO back for a lingering close.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
# `TokioIo` (tokio sockets as hyper IO) and `TokioTimer` (hyper's header read timeout).
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# The runtime under hyper, owned by `serve`: the multi-thread scheduler and its blocking pool
# (the router and the file I/O run there), TCP sockets, the stop signal, timeouts.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
# Library logging (as in graphersal) and the binary's stderr log subscriber.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }
# SIGINT/SIGTERM stop the server cleanly; the same crate and features as the graphersal CLI.
ctrlc = { version = "3.4", features = ["termination"] }

# The prebuilt release binary (release.yml): release code, fat link-time optimization, stripped
# symbols; panics still unwind (never `panic = "abort"`: a panic in one request must not take the
# server and its databases down), as Graphersal's own `dist` profile.
[profile.dist]
inherits = "release"
lto = "fat"
strip = true
