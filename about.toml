# cargo-about configuration: generates THIRD-PARTY-LICENSES.html for the `graphersal-server`
# binary (release.yml packs it into the release archive):
#   cargo about generate --locked --config about.toml \
#     --manifest-path crates/graphersal-server/Cargo.toml about.hbs > THIRD-PARTY-LICENSES.html
# The accepted list is Graphersal's (its about.toml, mirroring its deny.toml allow list).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
