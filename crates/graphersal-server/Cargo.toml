[package]
name = "graphersal-server"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "EXPERIMENTAL server for many Graphersal graph databases in one server directory, over HTTP, with a web UI and MCP"
readme = "../../README.md"
# The book is not published on a website: its sources on GitHub are the documentation.
documentation = "https://github.com/graphersal/graphersal-server/tree/main/book/src"
keywords = ["graph", "database", "server", "gremlin", "mcp"]
categories = ["database-implementations", "command-line-utilities", "web-programming::http-server"]
# What the published crate carries: the code, the embedded web UI (`ui/`, with its node tests and
# their fixture `ui/tests/root-info.json`, which a unit test reads), the OpenAPI files the binary
# embeds (`openapi/`), the end-to-end tests and the licence files. `readme` adds README.md.
include = [
    "/Cargo.toml",
    "/src/**",
    "/ui/**",
    "/openapi/**",
    "/tests/**",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[[bin]]
name = "graphersal-server"
path = "src/main.rs"

[dependencies]
# `persist`: the defaults of new databases in `server.toml` (chunk size, damage policy);
# `persist-zip`: verified ZIP backups of a database (`backups/<name>/<UTC time>.zip`; no extra
# dependency, the engine writes the archive itself); `io`: imports of GraphSON and GraphML files
# into new databases (adds graphersal's `quick-xml` dependency for GraphML).
graphersal = { workspace = true, features = ["persist", "persist-zip", "io", "script", "model-download"] }
# `ui-assets`: every database mount and the server's UI at `/` (the playground showing the
# `server` UI profile of `ui/`) serve the embedded playground;
# `mcp`: each database context is a host of the shared MCP endpoint (`/db/<name>/mcp`, and the
# graphs of the server-wide `/mcp`).
graphersal-serve = { workspace = true, features = ["ui-assets", "mcp"] }
graphersal-mcp = { workspace = true }
graphersal-session = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fd-lock = { workspace = true }
flate2 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio = { workspace = true }
ring = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ctrlc = { workspace = true }

# The server directory's owner check and the OS user name of audit records (`security`); the
# plain `fsync(2)` of a directory after an atomic write (`layout::sync_dir`); the process's
# resident memory and the machine's memory on macOS and Linux (`usage`).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The process's and the machine's memory on Windows (`usage`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# The h2c test's client (hyper's HTTP/2 client connection; no new crate).
hyper = { workspace = true, features = ["client"] }

# `cargo binstall graphersal-server`: the release's archives (named by platform, not by target;
# Linux builds are static musl, so they serve the gnu targets too). Keep in step with the matrix of
# .github/workflows/release.yml and the installers. Other targets (x86_64-apple-darwin included:
# no Intel macOS build): no release build, binstall falls back to building from source.
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-x86_64.tar.gz"
bin-dir = "{ name }-v{ version }-linux-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-x86_64.tar.gz"
bin-dir = "{ name }-v{ version }-linux-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-aarch64.tar.gz"
bin-dir = "{ name }-v{ version }-linux-aarch64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-aarch64.tar.gz"
bin-dir = "{ name }-v{ version }-linux-aarch64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-macos-arm64.tar.gz"
bin-dir = "{ name }-v{ version }-macos-arm64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-windows-x86_64.zip"
bin-dir = "{ name }-v{ version }-windows-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "zip"
