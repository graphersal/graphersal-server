[package]
name = "graphersal-server"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "EXPERIMENTAL server for many Graphersal graph databases in one server directory"
readme = "../../README.md"
# Private until its first public version; it depends on graphersal by path.
publish = false

[[bin]]
name = "graphersal-server"
path = "src/main.rs"

[dependencies]
# `persist`: the defaults of new databases in `server.toml` (chunk size, damage policy);
# `persist-zip`: verified ZIP backups of a database (`backups/<name>/<UTC time>.zip`; no extra
# dependency, the engine writes the archive itself); `io`: imports of GraphSON and GraphML files
# into new databases (adds graphersal's `quick-xml` dependency for GraphML).
graphersal = { workspace = true, features = ["persist", "persist-zip", "io"] }
# `ui-assets`: every database mount and the landing page at `/` serve the embedded playground;
# `mcp`: each database context is a host of the shared MCP endpoint (`/db/<name>/mcp`, and the
# graphs of the server-wide `/mcp`).
graphersal-serve = { workspace = true, features = ["ui-assets", "mcp"] }
graphersal-mcp = { workspace = true }
graphersal-session = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fd-lock = { workspace = true }
tiny_http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ctrlc = { workspace = true }
