# Configuration for `cargo deny check` (https://github.com/EmbarkStudios/cargo-deny), run by the
# `deny` job of .github/workflows/ci.yml.
#
# Checks the dependency tree of graphersal-server for licences compatible with distributing it
# under Apache-2.0 (source and the release binaries), RustSec advisories, duplicate and wildcard
# dependencies, and dependency sources. Modelled on Graphersal's deny.toml; the licence allow list
# holds the licences this tree uses (cargo-deny warns about unused entries); `accepted` in
# about.toml (THIRD-PARTY-LICENSES.html of the release archives) holds the same list plus MPL-2.0.
# Locally: `cargo install --locked cargo-deny`, then `cargo deny check`.

[graph]
# No `targets` list: every target platform is checked, so the Windows-only (windows-sys) and
# unix-only (libc) dependencies count too.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------------------------
# Advisories: the RustSec advisory database (https://rustsec.org).
# ---------------------------------------------------------------------------------------------
[advisories]
# Vulnerabilities, unsound and yanked crates are always errors in cargo-deny 0.16+; unmaintained
# crates are reported for the whole tree.
unmaintained = "all"
yanked = "deny"
# Add an advisory id here only together with a comment that says why it does not apply and when
# it will be revisited.
ignore = [
    # smartstring is unmaintained (archived upstream 2026-05-03) and has no fix: it is a mandatory
    # dependency of rhai, which Graphersal's `script` feature (the query language of every served
    # database) pulls in. An unmaintained-crate notice, not a vulnerability. Revisit with the
    # Graphersal version that drops it (the same entry as Graphersal's deny.toml).
    "RUSTSEC-2026-0249",
    # paste is unmaintained (archived upstream) and has no fixed release: a compile-time macro
    # crate (no code of it runs in the binary) and a mandatory dependency of `tokenizers`, which
    # Graphersal's `model2vec` runtime pulls in (S1: `model-download`). An unmaintained-crate
    # notice, not a vulnerability (the same entry as Graphersal's deny.toml).
    "RUSTSEC-2024-0436",
]

# ---------------------------------------------------------------------------------------------
# Licences: every entry is compatible with distributing graphersal-server under Apache-2.0.
# Copyleft licences (GPL, AGPL, LGPL, ...) are deliberately absent, so a new dependency under one
# of them fails the check. A licence added here must be in `accepted` of about.toml too.
# ---------------------------------------------------------------------------------------------
[licenses]
allow = [
    "Apache-2.0",
    # Apache-2.0 with the LLVM exception (rustix, linux-raw-sys, wasi): strictly more permissive
    # than plain Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    # BSD-3-Clause (subtle, via rustls of the model download): permissive, attribution only.
    "BSD-3-Clause",
    # ISC (ring, untrusted): permissive, functionally equivalent to MIT.
    "ISC",
    # Public-domain dedications (as an alternative to MIT; tiny-keccak via rhai).
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    # Unicode data licence (icu_*, unicode-ident): permissive.
    "Unicode-3.0",
]
# A dependency whose licence is detected with lower confidence is reported, not guessed.
confidence-threshold = 0.93
exceptions = [
    # MPL-2.0 is a weak, file-level copyleft licence. smartstring is a mandatory dependency of
    # rhai (Graphersal's `script` feature) and is linked unmodified, which MPL-2.0 permits in an
    # Apache-2.0 work; its source stays available on crates.io. Allowed for this crate only, so a
    # new MPL dependency is a conscious decision.
    { allow = ["MPL-2.0"], crate = "smartstring" },
    # CDLA-Permissive-2.0 is a permissive data licence (redistribution with the licence text, no
    # copyleft). webpki-roots is the Mozilla root-certificate list the Hugging Face model
    # download trusts (graphersal's `model-download`: ureq with rustls).
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

# model2vec-rs (Graphersal's `model2vec` runtime) declares its licence only as `license-file =
# "LICENSE"`, no SPDX expression; that file is the MIT licence text. The hash pins the file (the
# same entry as Graphersal's deny.toml).
[[licenses.clarify]]
crate = "model2vec-rs"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x1f86646e }]

[licenses.private]
# The workspace crate is checked like any other crate (it declares Apache-2.0).
ignore = false

# ---------------------------------------------------------------------------------------------
# Bans: duplicate versions and wildcard requirements.
# ---------------------------------------------------------------------------------------------
[bans]
# Several versions of one crate cost build time and binary size, not correctness: reported only.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# ---------------------------------------------------------------------------------------------
# Sources: crates.io only (a git dependency cannot be published to crates.io anyway).
# ---------------------------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
