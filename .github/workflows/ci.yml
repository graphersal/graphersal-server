name: CI

# CI runs by hand only (a decision of 2026-11-26: Actions minutes are limited), before a release
# and whenever a change needs it:
#   gh workflow run CI -f ref=<branch>        # or Actions tab -> CI -> Run workflow
#
# Platforms: Linux and Windows. Windows is the platform the maintainer does not test on locally;
# Linux is where most servers run (and its runner minutes are the cheapest). macOS is skipped: it
# is the maintainer's own machine (the full local checks run there before every merge) and macOS
# minutes cost ten times Linux ones; the Release workflow builds and smoke-tests macos-arm64.
#
# Jobs: format; per platform clippy, the Rust tests, the web UI's node tests and the smoke test
# of the built binary (scripts/smoke.sh on Linux, its PowerShell port scripts/smoke.ps1 on
# Windows); cargo-deny (licences, RustSec advisories, sources: deny.toml); the MSRV (1.88, the
# declared `rust-version`: `cargo install` users may have it), checked on Linux only.
#
# Graphersal's crates come from crates.io, pinned exactly in the root Cargo.toml; every cargo
# command runs `--locked` against the committed Cargo.lock. The playground the binary embeds
# ships in the published graphersal-serve crate (its `ui/`), and the node tests find it there
# through `cargo metadata` (ui/tests/profile.test.mjs; they fail on CI when it is missing).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of graphersal-server to check"
        type: string
        required: true
        default: main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only costs time and cache space on a fresh CI runner.
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung end-to-end test fails the job instead of running for GitHub's default of 6 hours.
    timeout-minutes: 90
    steps:
      # Byte-identical files on every platform (the Windows runner's git converts to CRLF by
      # default): the embedded web UI and the test data stay as committed.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # Unit tests (admin core, ops, models, router, console) and tests/server_tests.rs (the
      # binary end to end).
      - name: cargo test
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download every platform's crates (the node tests find graphersal-serve's ui/ through cargo metadata --offline)
        run: cargo fetch --locked
      - name: Web UI node tests
        run: node --test crates/graphersal-server/ui/tests/*.test.mjs
      - name: Build the binary
        run: cargo build --locked -p graphersal-server
      - name: Smoke test of the binary (scripts/smoke.sh)
        if: runner.os != 'Windows'
        run: SMOKE_BIN="$PWD/target/debug/graphersal-server" bash scripts/smoke.sh
      - name: Smoke test of the binary (scripts/smoke.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1 -Bin target/debug/graphersal-server.exe

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
